# 공통 설정 — 모든 프로파일이 공유한다.
# 프로파일별 차이는 application-<profile>.yaml 에만 둔다.
# 이 파일을 프로파일 파일로 통째로 복사하면 조용히 갈라진다.

spring:
  application:
    name: Contion-Spring-BE

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway 가 스키마의 실행 정본이다 (charter §5.3).
      # update / create 로 바꾸지 않는다 — 마이그레이션을 우회하게 된다.
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: false

  # --- 계약 패리티 (charter §5.1) -------------------------------------------
  # 아래 값들은 취향이 아니라 원본 NestJS 계약과 맞추기 위한 것이다.
  # 바꾸기 전에 upstream/tools/openapi/openapi.json 과의 diff 영향을 확인한다.
  jackson:
    datetime:
      # 날짜는 epoch 숫자가 아니라 ISO-8601 문자열이어야 한다.
      # Boot 4 는 Jackson 3(tools.jackson)을 쓴다. Jackson 2 에서 이 플래그가 살던
      # SerializationFeature 에는 더 이상 없고 DateTimeFeature 로 옮겨졌다.
      write-dates-as-timestamps: false
    deserialization:
      # 원본은 ValidationPipe(forbidNonWhitelisted)로 알 수 없는 필드를 거부한다.
      # Spring 기본값은 무시(false)이므로 명시적으로 켠다.
      fail-on-unknown-properties: true

springdoc:
  api-docs:
    # 기준선(upstream/tools/openapi/openapi.json)이 OpenAPI 3.0.0 이다.
    # 고정하지 않으면 3.1 로 생성되어 전 엔드포인트가 diff 에 뜬다.
    version: openapi_3_0

management:
  endpoints:
    web:
      exposure:
        include: health
